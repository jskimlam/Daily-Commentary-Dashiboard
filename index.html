<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Daily Chemical Brief</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700;900&family=DM+Mono:wght@400;500&family=Montserrat:wght@700;900&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
:root {
  --up:#DC2626; --dn:#1D4ED8; --flt:#111827;
  --up-bg:#FEF2F2; --dn-bg:#EFF6FF; --flt-bg:#F9FAFB;
  --lotte:#E31837; --g1:#111827; --g2:#374151; --g3:#6B7280; --g4:#9CA3AF; --g7:#F9FAFB; --white:#FFFFFF;
  --bd:#E5E7EB; --sh:0 4px 12px rgba(0,0,0,0.08);
  --sans:'Noto Sans KR',sans-serif; --disp:'Montserrat',sans-serif; --mono:'DM Mono',monospace;
  --highlight-bg: #FFEB3B;
  --brand-orange: #FF9800;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{font-family:var(--sans);background:var(--g7);color:var(--g1);min-height:100vh;-webkit-font-smoothing:antialiased;}

/* 헤더 영역 */
.hdr{background:var(--white);border-bottom:3px solid var(--lotte);position:sticky;top:0;z-index:200;box-shadow:0 2px 12px rgba(0,0,0,.08);}
.hdr-inner{max-width:1600px;margin:0 auto;padding:0 32px;display:flex;align-items:center;justify-content:space-between;height:64px;gap:20px;}
.hdr-brand{display:flex;align-items:center;gap:14px;flex-shrink:0;}

/* LAM 로고: 주황색 박스 + 검은색 글자 */
.hdr-mark{width:50px;height:38px;background:var(--brand-orange);border-radius:6px;display:flex;align-items:center;justify-content:center;font-family:var(--disp);font-size:14px;font-weight:900;color:#000 !important;border:2px solid #000;}

.hdr-title{font-family:var(--disp);font-size:18px;font-weight:900;color:#000;display:flex;align-items:baseline;}
.hdr-title span { color: var(--lotte); }

/* 저작권 문구: 검은색 + 아주 굵게(800) */
.copyright-text { 
  font-family: var(--sans); font-size: 13px; font-weight: 800; color: #000 !important; 
  margin-left: 14px; border-left: 2.5px solid #000; padding-left: 14px; white-space: nowrap;
}

.hdr-center{display:flex;align-items:center;gap:8px;flex:1;justify-content:center;}
.hdr-date-nav{display:flex;align-items:center;gap:6px;background:#f3f4f6;border-radius:8px;padding:6px 12px;border:1px solid var(--bd);}
.hdr-date-lbl{font-family:var(--mono);font-size:16px;font-weight:700;min-width:105px;text-align:center;}
.hdr-right{display:flex;align-items:center;gap:8px;flex-shrink:0;}

.btn{display:inline-flex;align-items:center;gap:6px;padding:10px 16px;border-radius:8px;font-size:13px;font-weight:700;cursor:pointer;transition:all 0.15s;border:1px solid transparent;white-space:nowrap;}
.btn-primary{background:var(--lotte);color:#fff;}
.btn-outline{background:var(--white);color:var(--g2);border:1px solid var(--bd);}

/* 메인 레이아웃 */
.layout{max-width:1600px;margin:0 auto;padding:24px 32px 80px;display:flex;gap:20px;}
.sidebar{width:240px;flex-shrink:0;display:flex;flex-direction:column;gap:12px;}

/* ⭐️ 날짜 어카이브 드롭다운 스타일 ⭐️ */
.arc-select-wrap { position: relative; width: 100%; }
.arc-select-btn {
  width: 100%; padding: 12px 15px; background: var(--white); border: 2px solid #000; border-radius: 8px;
  font-family: var(--mono); font-size: 14px; font-weight: 700; color: #000; cursor: pointer;
  display: flex; justify-content: space-between; align-items: center; box-shadow: var(--sh);
}
.arc-select-btn:hover { background: var(--g6); }
.arc-select-btn::after { content: '▼'; font-size: 10px; margin-left: 10px; }

.arc-dropdown {
  position: absolute; top: 100%; left: 0; width: 100%; max-height: 350px; overflow-y: auto;
  background: var(--white); border: 2px solid #000; border-top: none; border-radius: 0 0 8px 8px;
  z-index: 100; display: none; box-shadow: 0 10px 25px rgba(0,0,0,0.15);
}
.arc-dropdown.show { display: block; }
.arc-item {
  padding: 11px 15px; font-family: var(--mono); font-size: 13px; color: var(--g2); cursor: pointer;
  border-bottom: 1px solid var(--g6); display: flex; justify-content: space-between; align-items: center;
}
.arc-item:hover { background: #FFF9C4; color: #000; font-weight: 700; }
.arc-item.active { background: #FEF2F2; color: var(--lotte); font-weight: 800; }

.main{flex:1;min-width:0;display:flex;flex-direction:column;gap:18px;}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;}
.p-card{background:var(--white);border:1px solid var(--bd);border-radius:14px;overflow:hidden;box-shadow:var(--sh);display:flex;flex-direction:column;}
.card-bar{height:6px;}
.card-bar.wti{background:#DC2626;}.card-bar.sm{background:#7C3AED;}.card-bar.bz{background:#0369A1;}.card-bar.bd{background:#047857;}
.card-hdr{padding:16px 18px 10px;display:flex;justify-content:space-between;align-items:center;}
.card-prod{font-family:var(--disp);font-size:22px;font-weight:900;}

.card-price{padding:0 18px 10px;display:flex;align-items:baseline;justify-content:space-between;}
.p-val{font-family:var(--disp);font-size:46px;font-weight:900;line-height:1;}
.p-val.up{color:var(--up);}.p-val.dn{color:var(--dn);}.p-val.flt{color:var(--flt);}
.d-abs{font-family:var(--mono);font-size:18px;font-weight:700;}

.dir-badge{display:inline-block;padding:6px 16px;border-radius:30px;font-size:15px;font-weight:900;border:2px solid black;margin-bottom:15px;margin-left:18px;}
.dir-badge.up{background:var(--up);color:white;}.dir-badge.dn{background:var(--dn);color:white;}.dir-badge.flt{background:var(--g3);color:white;}

/* 굵은 코멘터리 보정 */
.section-label-box { display: inline-block; background-color: var(--highlight-bg); border: 2px solid #000; padding: 4px 12px; margin: 15px 18px 8px; border-radius: 4px; }
.section-label-text { font-family: var(--mono); font-size: 13px; font-weight: 900; color: #000; text-transform: uppercase; }
.section-body-text { padding: 0 18px 18px; font-size: 16px; line-height: 1.65; color: #000; white-space: pre-wrap; word-break: keep-all; }
.text-bold { font-weight: 800 !important; }

/* 📱 [최적화 미디어 쿼리 - 갤럭시 S25 & 폴드7] */
@media (max-width: 480px) {
  .hdr-inner { height: auto; flex-direction: column; padding: 15px 16px; gap: 15px; }
  .copyright-text { display: block; border-left: none; padding-left: 0; margin-left: 0; margin-top: 5px; font-size: 11px; text-align: center; }
  .hdr-right { width: 100%; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .layout { padding: 16px 12px; flex-direction: column; }
  .sidebar { width: 100%; }
  .grid4 { grid-template-columns: 1fr; }
  .mobile-action-group { display: flex; gap: 8px; margin-top: 10px; width: 100%; }
}
@media (min-width: 481px) and (max-width: 1024px) { .grid4 { grid-template-columns: 1fr 1fr; } }

#overlay{position:fixed;inset:0;z-index:500;background:rgba(0,0,0,.6);backdrop-filter:blur(8px);display:none;align-items:center;justify-content:center;padding:20px;}
#overlay.open{display:flex;}
#modal{width:860px;max-height:94vh;background:var(--white);border-radius:16px;display:flex;flex-direction:column;overflow:hidden;}
#toast{position:fixed;bottom:30px;right:30px;z-index:9999;padding:15px 25px;border-radius:10px;font-weight:700;color:#fff;opacity:0;transition:0.3s;box-shadow:var(--sh);}
#toast.show{opacity:1;}
</style>
</head>
<body>

<header class="hdr">
  <div class="hdr-inner">
    <div class="hdr-brand">
      <div class="hdr-mark">LAM</div>
      <div class="hdr-title">Daily <span>Chemical</span> Brief <span class="copyright-text">created by JSKIM of LAM (첨단구매1팀)</span></div>
    </div>
    <div class="hdr-center">
      <div class="hdr-date-nav">
        <button onclick="moveDate(1)" style="background:none;border:none;cursor:pointer;font-size:24px;">&#8249;</button>
        <div class="hdr-date-lbl" id="hdr-date-lbl">—</div>
        <button onclick="moveDate(-1)" style="background:none;border:none;cursor:pointer;font-size:24px;">&#8250;</button>
      </div>
    </div>
    <div class="hdr-right">
      <button class="btn btn-outline" onclick="loadData()">새로고침</button>
      <button class="btn btn-primary" onclick="openModal()">+ NEW ENTRY</button>
    </div>
  </div>
</header>

<div class="layout">
  <aside class="sidebar">
    <div class="arc-select-wrap">
      <div style="font-size:11px; font-weight:800; color:var(--g3); margin-bottom:6px; text-transform:uppercase; letter-spacing:1px;">Archive</div>
      <button class="arc-select-btn" id="arc-selected-label" onclick="toggleArc()">날짜 선택</button>
      <div class="arc-dropdown" id="arc-dropdown"></div>
    </div>
  </aside>
  
  <main class="main">
    <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px;">
      <div style="font-family:var(--disp); font-size:28px; font-weight:900;" id="main-date">—</div>
      <div class="mobile-action-group">
        <button class="btn btn-outline" onclick="dlImage()">이미지 저장</button>
        <button class="btn btn-outline" onclick="window.print()">PDF 출력</button>
      </div>
    </div>
    <div class="grid4" id="grid"></div>
  </main>
</div>

<div id="overlay">
  <div id="modal">
    <div style="padding:20px; border-bottom:1px solid #eee; display:flex; justify-content:space-between; background:#f9fafb;">
      <div style="font-weight:900; font-size:18px;" id="modal-title">NEW BRIEFING ENTRY</div>
      <button onclick="closeModal()" style="background:none; border:none; cursor:pointer; font-size:28px;">&times;</button>
    </div>
    <div style="display:flex; border-bottom:1px solid #eee; overflow-x:auto;">
      <button class="m-tab active" onclick="switchTab('WTI')" style="flex:1; padding:15px; border:none; background:none; cursor:pointer; font-weight:800;">WTI</button>
      <button class="m-tab" onclick="switchTab('Styrene')" style="flex:1; padding:15px; border:none; background:none; cursor:pointer; font-weight:800;">Styrene</button>
      <button class="m-tab" onclick="switchTab('Benzene')" style="flex:1; padding:15px; border:none; background:none; cursor:pointer; font-weight:800;">Benzene</button>
      <button class="m-tab" onclick="switchTab('Butadiene')" style="flex:1; padding:15px; border:none; background:none; cursor:pointer; font-weight:800;">Butadiene</button>
    </div>
    <div id="tab-panels" style="flex:1; overflow-y:auto; padding:20px;"></div>
    <div style="padding:15px 20px; background:#f9fafb; border-top:1px solid #eee; display:flex; justify-content:flex-end; gap:10px;">
      <button class="btn btn-outline" onclick="doParse()">파싱 실행</button>
      <button class="btn btn-primary" onclick="doSaveAll()">전체 저장</button>
    </div>
  </div>
</div>
<div id="toast"></div>

<script>
const GAS='https://script.google.com/macros/s/AKfycbzMMoEQyh8ADth6FhKyBPD-mPbfUX5XmjP9ShihM4plBtZQ9363uqmUXXCYXRXjyXB/exec';
const PRODS=['WTI','Styrene','Benzene','Butadiene'];
const PCLS={WTI:'wti',Styrene:'sm',Benzene:'bz',Butadiene:'bd'};
let allData={}, allDates=[], curDate='', activeTab='WTI';

// 관리자 보안 체크
function checkAdmin() {
  const pw = prompt("관리자 비밀번호를 입력하세요:");
  if (pw === "0111") return true;
  if (pw !== null) alert("비밀번호가 올바르지 않습니다.");
  return false;
}

// ⭐️ 드롭다운 토글 ⭐️
function toggleArc() { document.getElementById('arc-dropdown').classList.toggle('show'); }
window.onclick = function(e) { if (!e.target.matches('.arc-select-btn')) { document.getElementById('arc-dropdown').classList.remove('show'); } }

function buildPanels(){
  document.getElementById('tab-panels').innerHTML=PRODS.map(p=>`
    <div class="tab-panel${p===activeTab?' active':''}" id="panel-${p}" style="display:${p===activeTab?'block':'none'}">
      <textarea id="ta-${p}" style="width:100%; height:100px; margin-bottom:15px; padding:12px; border-radius:8px; border:1px solid #ddd; font-size:14px;" placeholder="${p} 브리핑 전문"></textarea>
      <div style="display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px; margin-bottom:15px;">
        <div><label style="font-size:11px; font-weight:700;">가격</label><input type="number" id="f-price-${p}" step="0.01" style="width:100%; padding:8px; border:1px solid #ccc; border-radius:5px;"></div>
        <div><label style="font-size:11px; font-weight:700;">변동률%</label><input type="number" id="f-pct-${p}" step="0.01" style="width:100%; padding:8px; border:1px solid #ccc; border-radius:5px;"></div>
        <div><label style="font-size:11px; font-weight:700; color:red;">기준일</label><input type="date" id="f-date-${p}" style="width:100%; padding:7px; border:1.5px solid red; border-radius:5px;"></div>
      </div>
      <div style="margin-bottom:10px;"><label style="font-size:11px; font-weight:700;">시장판정</label><select id="f-dir-${p}" style="width:100%; padding:8px; border:1px solid #ccc; border-radius:5px;"><option>상승</option><option>하락</option><option>보합</option></select></div>
      <textarea id="f-co-${p}" style="width:100%; height:60px; padding:10px; margin-bottom:10px; border:1px solid #ccc; border-radius:5px;" placeholder="코멘터리"></textarea>
      <textarea id="f-fa-${p}" style="width:100%; height:150px; padding:10px; border:1px solid #ccc; border-radius:5px;" placeholder="변동요인"></textarea>
    </div>`).join('');
}

async function loadData(){
  try{
    const res=await fetch(GAS+'?action=load');
    const json=await res.json();
    if(!json.success) throw new Error(json.message);
    allData=json.data; allDates=json.dates;
    buildArc();
    if(!curDate && allDates.length>0) curDate=allDates[0];
    if(curDate) renderDate(curDate);
  }catch(e){toast('데이터 로드 실패','err');}
}

function renderDate(date){
  curDate=date; document.getElementById('hdr-date-lbl').textContent=date;
  document.getElementById('main-date').textContent=date;
  document.getElementById('arc-selected-label').textContent = date;
  document.getElementById('grid').innerHTML=PRODS.map(p=>renderCard(p,(allData[p]||[]).find(e=>e.date===date),date)).join('');
  buildArc();
}

function renderCard(prod,entry,date){
  const cls=PCLS[prod];
  if(!entry) return `<div class="p-card"><div class="card-bar ${cls}"></div><div style="padding:40px; text-align:center; color:#999; font-size:13px;">데이터 없음</div></div>`;
  const dir=entry.direction==='상승'?'up':entry.direction==='하락'?'dn':'flt';
  const eJSON=encodeURIComponent(JSON.stringify(entry));
  return `<div class="p-card">
    <div class="card-bar ${cls}"></div>
    <div class="card-hdr">
      <div class="card-prod ${cls}">${prod}</div>
      <div class="card-acts">
        <button style="border:none; cursor:pointer; background:none; font-size:20px; padding:5px;" onclick='openModal("${prod}","${date}",JSON.parse(decodeURIComponent("${eJSON}")))'>✎</button>
        <button style="border:none; cursor:pointer; background:none; font-size:20px; color:red; padding:5px;" onclick="delEntry('${prod}','${date}')">&times;</button>
      </div>
    </div>
    <div class="card-price">
      <div class="p-val ${dir}">${entry.price.toFixed(2)}</div>
      <div class="p-delta ${dir}">${(entry.changePct>=0?'+':'')+entry.changePct.toFixed(2)}%</div>
    </div>
    <div><span class="dir-badge ${dir}">${entry.direction}</span></div>
    <div class="section-label-box"><span class="section-label-text">COMMENTARY</span></div>
    <div class="section-body-text text-bold">${entry.commentary}</div>
    <div class="section-label-box"><span class="section-label-text">MARKET FACTORS</span></div>
    <div class="section-body-text text-normal">${entry.factors}</div>
  </div>`;
}

// ⭐️ 드롭다운 빌드 ⭐️
function buildArc(){
  document.getElementById('arc-dropdown').innerHTML=allDates.map(d=>`<div class="arc-item ${d===curDate?'active':''}" onclick="renderDate('${d}')">${d}</div>`).join('');
}

function moveDate(offset){
  const idx = allDates.indexOf(curDate);
  const next = allDates[idx + offset];
  if(next) renderDate(next);
}

function openModal(prod,date,entry){
  if (!checkAdmin()) return;
  document.getElementById('overlay').classList.add('open');
  if(prod) switchTab(prod);
  if(entry && prod){
    document.getElementById('modal-title').textContent = 'EDIT BRIEFING ENTRY';
    document.getElementById(`f-price-${prod}`).value=entry.price;
    document.getElementById(`f-pct-${prod}`).value=entry.changePct;
    document.getElementById(`f-date-${prod}`).value=entry.date.replace(/\./g,'-');
    document.getElementById(`f-dir-${prod}`).value=entry.direction;
    document.getElementById(`f-co-${prod}`).value=entry.commentary;
    document.getElementById(`f-fa-${prod}`).value=entry.factors;
  } else {
    document.getElementById('modal-title').textContent = 'NEW BRIEFING ENTRY';
    const today = new Date().toISOString().split('T')[0];
    PRODS.forEach(p => { if(!document.getElementById(`f-date-${p}`).value) document.getElementById(`f-date-${p}`).value = today; });
  }
}

function closeModal(){ document.getElementById('overlay').classList.remove('open'); }
function switchTab(p){
  activeTab=p;
  document.querySelectorAll('.m-tab').forEach(t=>t.classList.toggle('active', t.innerText===p));
  document.querySelectorAll('.tab-panel').forEach(panel=>panel.style.display=(panel.id===`panel-${p}`?'block':'none'));
}

async function doSaveAll(){
  let count = 0;
  for(const p of PRODS){
    const price = document.getElementById(`f-price-${p}`).value;
    const date = document.getElementById(`f-date-${p}`).value;
    if(price && date){
      const data={ date: date.replace(/-/g,'.'), price: parseFloat(price), changePct: parseFloat(document.getElementById(`f-pct-${p}`).value || 0), direction: document.getElementById(`f-dir-${p}`).value, commentary: document.getElementById(`f-co-${p}`).value.trim(), factors: document.getElementById(`f-fa-${p}`).value.trim(), outlook: '' };
      try { await fetch(GAS, { method: 'POST', headers: { 'Content-Type': 'text/plain' }, body: JSON.stringify({action:'save', sheet:p, data}) }); count++; } catch(e){}
    }
  }
  if(count > 0){ toast(`✅ ${count}개 품목 반영 성공`, 'ok'); closeModal(); loadData(); }
}

async function delEntry(prod,date){
  if (!checkAdmin()) return;
  if(!confirm(`[${prod}] ${date} 데이터를 삭제하시겠습니까?`))return;
  try{ await fetch(GAS, {method:'POST', headers:{'Content-Type':'text/plain'}, body:JSON.stringify({action:'delete', sheet:prod, rowKey:{date}})}); toast('🗑 삭제 완료', 'ok'); loadData(); } catch(e){}
}

function parseWTI(txt) {
  const f = {}; let m;
  if (txt.includes('WTI 데일리 브리핑')) {
    m = txt.match(/WTI\s*M-1:\s*\$\s*([\d,.]+)\/b/i);
    if (m) f.price = parseFloat(m[1].replace(/,/g, ''));
    m = txt.match(/\(([▼▲])\s*\$\s*([\d,.]+)\/b,\s*([+-]?[\d.]+)%\)/i);
    if (m) { f.pct = parseFloat(m[3]); f.direction = m[1] === '▲' ? '상승' : '하락'; }
    m = txt.match(/2\)\s*가격\s*변동\s*요인\s*한줄[^\n]*\n([^\n]+)/);
    if (m) f.commentary = m[1].trim();
    const sec3 = txt.match(/3\)\s*변동요인\s*구체\s*리스트[^\n]*\n([\s\S]*?)(?=\n4\)|$)/);
    if (sec3) { f.factors = sec3[1].split('\n').map(s => s.trim()).filter(s => s.length > 2).map(s => '• ' + s).join('\n'); }
    m = txt.match(/4\)\s*결론\s*및\s*전망[^\n]*\n([^\n]+)/);
    if (m) { const outlook = m[1].trim(); if (f.factors) f.factors += "\n\n[전망] " + outlook; else f.factors = "[전망] " + outlook; }
    const now = new Date(); const yesterday = new Date(now.getFullYear(), now.getMonth(), now.getDate() - 1);
    f.dateStr = yesterday.toISOString().split('T')[0];
    return f;
  }
  return {};
}

function doParse(){
  const p=activeTab, txt=document.getElementById(`ta-${p}`).value.trim();
  if(!txt) return;
  let f = p==='WTI' ? parseWTI(txt) : {};
  if(!f.price) {
    const priceM = txt.match(/CFR\s*China[^\n]*?\$\s*([\d,.]+)/i) || txt.match(/FOB\s*Korea[^\n]*?\$\s*([\d,.]+)/i);
    if(priceM) f.price = priceM[1].replace(/,/g,'');
    const pctM = txt.match(/\(([\d.+-]+)%\)/);
    if(pctM) f.pct = pctM[1];
    if(txt.includes('상승') || txt.includes('▲')) f.direction = '상승';
    else if(txt.includes('하락') || txt.includes('▼')) f.direction = '하락';
    const dateM = txt.match(/(\d{4})년\s*(\d{1,2})월\s*(\d{1,2})일/) || txt.match(/(\d{4})[\-.\/](\d{1,2})[\-.\/](\d{1,2})/);
    if(dateM) f.dateStr = `${dateM[1]}-${dateM[2].padStart(2,'0')}-${dateM[3].padStart(2,'0')}`;
    let fTxt = txt.split(/[.\n]/).filter(s => s.length > 20).slice(0, 6).join('.\n\n');
    if(txt.includes('**')) { fTxt = txt.split('**').filter(s => s.trim().length > 5).map(s => '• ' + s.replace(/\//g, '').trim()).join('\n\n'); }
    f.factors = fTxt;
  }
  if(f.price) document.getElementById(`f-price-${p}`).value = f.price;
  if(f.pct) document.getElementById(`f-pct-${p}`).value = f.pct;
  if(f.direction) document.getElementById(`f-dir-${p}`).value = f.direction;
  if(f.dateStr) document.getElementById(`f-date-${p}`).value = f.dateStr;
  if(f.commentary) document.getElementById(`f-co-${p}`).value = f.commentary;
  if(f.factors) document.getElementById(`f-fa-${p}`).value = f.factors;
  toast(`${p} 파싱 완료`, 'ok');
}

function toast(m,t){const e=document.getElementById('toast'); e.textContent=m; e.className='show '+t; e.style.background=(t==='ok'?'#065F46':'#991B1B'); setTimeout(()=>e.className='',3000);}
function dlImage(){ const el=document.getElementById('grid'); html2canvas(el, {backgroundColor:'#f9fafb', scale:2}).then(canvas => { const a = document.createElement('a'); a.href=canvas.toDataURL(); a.download=`DailyBrief_${curDate}.png`; a.click(); }); }

buildPanels();
loadData();
</script>
