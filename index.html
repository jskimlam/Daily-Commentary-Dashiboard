<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Daily Chemical Brief</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700;900&family=DM+Mono:wght@400;500&family=Montserrat:wght@700;900&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
/* 기존 스타일 그대로 유지 */
:root { --up:#DC2626; --dn:#1D4ED8; --flt:#111827; --up-bg:#FEF2F2; --dn-bg:#EFF6FF; --flt-bg:#F9FAFB; --up-bd:#FECACA; --dn-bd:#BFDBFE; --flt-bd:#E5E7EB; --lotte:#E31837; --lotte2:#B01229; --g1:#111827; --g2:#374151; --g3:#6B7280; --g4:#9CA3AF; --g5:#E5E7EB; --g6:#F3F4F6; --g7:#F9FAFB; --white:#FFFFFF; --bd:#E5E7EB; --sh:0 1px 3px rgba(0,0,0,.08),0 1px 2px rgba(0,0,0,.06); --sh2:0 4px 16px rgba(0,0,0,.10),0 2px 4px rgba(0,0,0,.06); --sh3:0 20px 60px rgba(0,0,0,.15); --mono:'DM Mono',monospace; --sans:'Noto Sans KR',sans-serif; --disp:'Montserrat',sans-serif; --wti:#DC2626; --sm:#7C3AED; --bz:#0369A1; --bd2:#047857; }
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{font-family:var(--sans);background:var(--g7);color:var(--g1);min-height:100vh;-webkit-font-smoothing:antialiased;}
.hdr{background:var(--white);border-bottom:3px solid var(--lotte);position:sticky;top:0;z-index:200;box-shadow:0 2px 12px rgba(0,0,0,.08);}
.hdr-inner{max-width:1600px;margin:0 auto;padding:0 32px;display:flex;align-items:center;justify-content:space-between;height:64px;gap:24px;}
.hdr-brand{display:flex;align-items:center;gap:14px;}.hdr-mark{width:38px;height:38px;background:var(--lotte);border-radius:6px;display:flex;align-items:center;justify-content:center;font-family:var(--disp);font-size:15px;font-weight:900;color:#fff;}
.hdr-title{font-family:var(--disp);font-size:17px;font-weight:900;color:var(--g1);}.hdr-title span{color:var(--lotte);}.hdr-sub{font-family:var(--mono);font-size:10px;color:var(--g4);border-left:1px solid var(--bd);padding-left:14px;text-transform:uppercase;}
.hdr-center{display:flex;align-items:center;gap:8px;flex:1;justify-content:center;}.hdr-date-nav{display:flex;align-items:center;gap:6px;background:var(--g6);border:1px solid var(--bd);border-radius:8px;padding:6px 10px;}
.nav-btn{background:none;border:none;cursor:pointer;color:var(--g3);font-size:16px;padding:2px 6px;border-radius:4px;}.nav-btn:hover{background:var(--white);color:var(--g1);}
.hdr-date-lbl{font-family:var(--mono);font-size:13px;font-weight:500;min-width:96px;text-align:center;}.hdr-right{display:flex;align-items:center;gap:8px;}.hdr-clock{font-family:var(--mono);font-size:10px;color:var(--g4);}
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:6px;font-size:12px;font-weight:600;cursor:pointer;transition:all .15s;border:1px solid transparent;white-space:nowrap;}
.btn-primary{background:var(--lotte);color:#fff;}.btn-outline{background:var(--white);color:var(--g2);border-color:var(--bd);}
.layout{max-width:1600px;margin:0 auto;padding:24px 32px 80px;display:flex;gap:20px;}
.sidebar{width:210px;flex-shrink:0;display:flex;flex-direction:column;gap:12px;}.s-card{background:var(--white);border:1px solid var(--bd);border-radius:10px;overflow:hidden;box-shadow:var(--sh);}
.s-title{font-family:var(--mono);font-size:10px;text-transform:uppercase;color:var(--g3);padding:11px 14px 9px;border-bottom:1px solid var(--bd);}
.arc-list{max-height:400px;overflow-y:auto;}.arc-item{padding:9px 14px;font-family:var(--mono);font-size:11px;color:var(--g2);cursor:pointer;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--g6);}
.arc-item.active{background:#FEF2F2;color:var(--lotte);font-weight:600;border-left:3px solid var(--lotte);}.arc-dot{width:6px;height:6px;border-radius:50%;}
.ws-wrap{padding:12px 14px;display:flex;flex-direction:column;gap:9px;}.ws-row{display:flex;align-items:center;justify-content:space-between;}.ws-prod{font-size:11px;font-weight:600;color:var(--g2);}
.ws-trend{display:flex;gap:2px;}.ws-pip{width:13px;height:13px;border-radius:2px;font-size:9px;display:flex;align-items:center;justify-content:center;font-weight:700;}
.ws-pip.up{background:#FEE2E2;color:var(--up);}.ws-pip.dn{background:#DBEAFE;color:var(--dn);}.ws-pip.flt{background:var(--g5);color:var(--g3);}
.main{flex:1;min-width:0;display:flex;flex-direction:column;gap:18px;}.date-hdr{display:flex;align-items:center;justify-content:space-between;}.date-big{font-family:var(--disp);font-size:26px;font-weight:900;}.date-day{font-size:13px;color:var(--g3);}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;}.p-card{background:var(--white);border:1px solid var(--bd);border-radius:12px;overflow:hidden;box-shadow:var(--sh);display:flex;flex-direction:column;}
.card-bar{height:4px;}.card-bar.wti{background:var(--wti);}.card-bar.sm{background:var(--sm);}.card-bar.bz{background:var(--bz);}.card-bar.bd{background:var(--bd2);}
.card-hdr{padding:14px 16px 11px;border-bottom:1px solid var(--bd);display:flex;align-items:flex-start;justify-content:space-between;}.card-prod{font-family:var(--disp);font-size:17px;font-weight:900;}.card-acts{display:flex;gap:3px;}
.c-btn{background:none;border:1px solid var(--bd);border-radius:4px;padding:4px 7px;font-size:10px;color:var(--g4);cursor:pointer;font-family:var(--mono);}.card-price{padding:12px 16px 8px;display:flex;align-items:flex-end;justify-content:space-between;}
.p-val{font-family:var(--disp);font-size:34px;font-weight:900;line-height:1;}.p-val.up{color:var(--up);}.p-val.dn{color:var(--dn);}.p-val.flt{color:var(--flt);}.p-delta{text-align:right;}.d-abs{font-family:var(--mono);font-size:15px;font-weight:500;}
.dir-wrap{padding:0 16px 8px;display:flex;gap:4px;}.dir-badge{padding:3px 10px;border-radius:20px;font-size:11px;font-weight:700;}.dir-badge.up{background:var(--up-bg);color:var(--up);border:1px solid var(--up-bd);}
.dir-badge.dn{background:var(--dn-bg);color:var(--dn);border:1px solid var(--dn-bd);}.dir-badge.flt{background:var(--flt-bg);color:var(--flt);border:1px solid var(--flt-bd);}
.spark-wrap{padding:5px 16px 8px;border-bottom:1px solid var(--g6);}.spark-canvas{width:100%;height:34px;}.c-sec{padding:10px 16px;border-bottom:1px solid var(--g6);}
.sec-lbl{font-family:var(--mono);font-size:9px;color:var(--g4);margin-bottom:6px;text-transform:uppercase;}.sec-txt{font-size:14px;line-height:1.78;color:var(--g2);word-break:keep-all;}.sec-txt.co{font-weight:600;color:var(--g1);}
.wk-sec{background:var(--white);border:1px solid var(--bd);border-radius:12px;overflow:hidden;box-shadow:var(--sh);}.wk-table{width:100%;border-collapse:collapse;font-size:11px;}
.wk-table th{background:var(--g7);padding:7px 14px;text-align:right;border-bottom:1px solid var(--bd);color:var(--g4);font-family:var(--mono);}.wk-table td{padding:8px 14px;text-align:right;border-bottom:1px solid var(--g6);font-family:var(--mono);}
#overlay{position:fixed;inset:0;z-index:500;background:rgba(0,0,0,.5);backdrop-filter:blur(8px);display:none;align-items:center;justify-content:center;padding:20px;}
#overlay.open{display:flex;}#modal{width:840px;max-height:92vh;background:var(--white);border-radius:14px;display:flex;flex-direction:column;overflow:hidden;}
.m-hdr{padding:16px 22px;border-bottom:1px solid var(--bd);display:flex;align-items:center;justify-content:space-between;background:var(--g7);}.m-tabs{display:flex;border-bottom:1px solid var(--bd);}
.m-tab{padding:11px 18px;font-size:12px;font-weight:600;color:var(--g4);cursor:pointer;background:none;border:none;border-bottom:3px solid transparent;}
.m-tab.active{color:var(--g1);border-bottom-color:var(--lotte);}.m-body{flex:1;overflow-y:auto;padding:18px 22px;display:flex;flex-direction:column;gap:14px;}
.tab-panel{display:none;flex-direction:column;gap:14px;}.tab-panel.active{display:flex;}.m-sec{background:var(--g7);border:1px solid var(--bd);border-radius:8px;padding:14px 16px;}
.m-ftr{padding:12px 22px;border-top:1px solid var(--bd);display:flex;gap:7px;align-items:center;background:var(--g7);}
#toast{position:fixed;bottom:22px;right:22px;z-index:9999;padding:11px 18px;border-radius:7px;font-family:var(--mono);font-size:12px;color:#fff;opacity:0;transition:all .22s;}
#toast.show{opacity:1;}#toast.ok{background:#065F46;}#toast.err{background:#991B1B;}
</style>
</head>
<body>

<header class="hdr">
  <div class="hdr-inner">
    <div class="hdr-brand">
      <div class="hdr-mark">DC</div>
      <div class="hdr-title">Daily <span>Chemical</span> Brief</div>
      <div class="hdr-sub">Petrochemical Monitor</div>
    </div>
    <div class="hdr-center">
      <div class="hdr-date-nav">
        <button class="nav-btn" id="btn-prev">&#8249;</button>
        <div class="hdr-date-lbl" id="hdr-date-lbl">—</div>
        <button class="nav-btn" id="btn-next">&#8250;</button>
      </div>
    </div>
    <div class="hdr-right">
      <div class="hdr-clock" id="clock"></div>
      <button class="btn btn-outline" onclick="loadData()">&#8635; 새로고침</button>
      <button class="btn btn-primary" onclick="openModal()">+ NEW ENTRY</button>
    </div>
  </div>
</header>

<div class="layout">
  <aside class="sidebar">
    <div class="s-card"><div class="s-title">날짜 아카이브</div><div class="arc-list" id="arc-list"></div></div>
    <div class="s-card"><div class="s-title">주간 트렌드</div><div class="ws-wrap" id="ws-wrap"></div></div>
  </aside>
  <main class="main">
    <div class="date-hdr">
      <div><span class="date-big" id="main-date">—</span> <span class="date-day" id="main-day"></span></div>
      <div>
        <button class="btn btn-outline" onclick="dlPDF()">PDF</button>
        <button class="btn btn-outline" onclick="dlImage()">이미지</button>
        <button class="btn btn-outline" onclick="copyMsg()">메신저</button>
      </div>
    </div>
    <div class="grid4" id="grid"></div>
    <div class="wk-sec">
      <div style="padding:13px 18px;font-weight:700;font-size:12px;">주간 가격 요약 <span id="wk-range" style="font-weight:400;color:var(--g3);"></span></div>
      <table class="wk-table"><thead><tr id="wk-thead"></tr></thead><tbody id="wk-tbody"></tbody></table>
    </div>
  </main>
</div>

<div id="overlay">
  <div id="modal">
    <div class="m-hdr">
      <div style="font-weight:700;" id="modal-title">NEW ENTRY</div>
      <button onclick="closeModal()" style="background:none;border:none;cursor:pointer;font-size:20px;">&#10005;</button>
    </div>
    <div class="m-tabs">
      <button class="m-tab active" onclick="switchTab('WTI')" data-tab="WTI">WTI</button>
      <button class="m-tab" onclick="switchTab('Styrene')" data-tab="Styrene">Styrene</button>
      <button class="m-tab" onclick="switchTab('Benzene')" data-tab="Benzene">Benzene</button>
      <button class="m-tab" onclick="switchTab('Butadiene')" data-tab="Butadiene">Butadiene</button>
    </div>
    <div class="m-body" id="tab-panels">
      </div>
    <div class="m-ftr">
      <div id="m-info" style="flex:1;font-size:10px;color:var(--g4);">파싱된 항목들이 시트로 개별 저장됩니다.</div>
      <button class="btn btn-outline" onclick="doParse()">파싱</button>
      <button class="btn btn-primary" onclick="doSaveAll()">전체 저장</button>
    </div>
  </div>
</div>
<div id="toast"></div>

<script>
// 웹앱 URL을 본인의 주소로 교체하세요
const GAS='https://script.google.com/macros/s/AKfycbxZMMoEQyh8ADth6FhKyBPD-mPbfUX5XmjP9ShihM4plBtZQ9363uqmUXXCYXRXjyXB/exec';
const PRODS=['WTI','Styrene','Benzene','Butadiene'];
let allData={}, allDates=[], curDate='', activeTab='WTI', tabDone={}, sparkData={};

function tick(){const k=new Date(Date.now()+9*3600000);document.getElementById('clock').textContent=k.toISOString().slice(0,19).replace('T',' ')+' KST';}
tick();setInterval(tick,1000);

// 페이지 로드 시 입력창 패널 한 번만 빌드 (데이터 보존을 위함)
function buildPanels(){
  document.getElementById('tab-panels').innerHTML=PRODS.map(p=>`
    <div class="tab-panel${p===activeTab?' active':''}" id="panel-${p}">
      <textarea id="ta-${p}" style="width:100%;height:100px;margin-bottom:10px;padding:10px;border-radius:5px;border:1px solid #ddd;" placeholder="${p} 기사 전문 붙여넣기"></textarea>
      <div class="m-sec">
        <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:10px;">
          <div><label style="font-size:9px;color:#888;">가격</label><input type="number" id="f-price-${p}" style="width:100%;padding:5px;"></div>
          <div><label style="font-size:9px;color:#888;">변동률%</label><input type="number" id="f-pct-${p}" style="width:100%;padding:5px;"></div>
          <div><label style="font-size:9px;color:#888;">기준일</label><input type="date" id="f-date-${p}" style="width:100%;padding:4px;"></div>
        </div>
        <div style="margin-bottom:10px;"><label style="font-size:9px;color:#888;">판정</label><select id="f-dir-${p}" style="width:100%;padding:5px;"><option>상승</option><option>하락</option><option>보합</option></select></div>
        <textarea id="f-co-${p}" style="width:100%;height:60px;margin-bottom:8px;padding:8px;border:1px solid #eee;" placeholder="코멘터리"></textarea>
        <textarea id="f-fa-${p}" style="width:100%;height:200px;padding:8px;border:1px solid #eee;" placeholder="변동요인/전망"></textarea>
      </div>
    </div>`).join('');
}

async function loadData(){
  try{
    const[rM,rS]=await Promise.all([fetch(GAS+'?action=load'),fetch(GAS+'?action=sparkline&days=10')]);
    const[jM,jS]=await Promise.all([rM.json(),rS.json()]);
    if(!jM.success)throw new Error(jM.message);
    allData=jM.data;allDates=jM.dates;sparkData=jS.data||{};
    buildArc();buildWsSidebar();
    if(!curDate&&allDates.length>0)curDate=allDates[0];
    if(curDate)renderDate(curDate);
  }catch(e){toast('로드 실패: '+e.message,'err');}
}

function renderDate(date){
  document.getElementById('hdr-date-lbl').textContent=date;
  document.getElementById('main-date').textContent=date;
  document.getElementById('grid').innerHTML=PRODS.map(p=>renderCard(p,(allData[p]||[]).find(e=>e.date===date),date)).join('');
  PRODS.forEach(p=>drawSpark(p,sparkData[p]||[]));
  buildWkTable();
}

function renderCard(prod,entry,date){
  const cls=PCLS[prod] || 'wti';
  if(!entry) return `<div class="p-card"><div class="card-bar ${cls}"></div><div style="padding:40px;text-align:center;color:var(--g4);font-size:11px;">데이터 없음</div></div>`;
  const dir=entry.direction==='상승'?'up':entry.direction==='하락'?'dn':'flt';
  return `<div class="p-card">
    <div class="card-bar ${cls}"></div>
    <div class="card-hdr"><div class="card-prod ${cls}">${prod}</div><div class="card-acts">
      <button class="c-btn" onclick='openModal("${prod}","${date}",${JSON.stringify(entry)})'>✎</button>
      <button class="c-btn" onclick="delEntry('${prod}','${date}')">✕</button>
    </div></div>
    <div class="card-price"><div class="p-val ${dir}">${entry.price.toFixed(2)}</div><div class="p-delta"><div class="d-abs ${dir}">${(entry.changePct>=0?'+':'')+entry.changePct.toFixed(2)}%</div></div></div>
    <div class="dir-wrap"><span class="dir-badge ${dir}">${entry.direction}</span></div>
    <div class="spark-wrap"><canvas class="spark-canvas" id="spark-${prod}"></canvas></div>
    <div class="c-sec"><div class="sec-lbl">코멘터리</div><div class="sec-txt co">${entry.commentary}</div></div>
    <div class="c-sec"><div class="sec-lbl">변동요인</div><div class="sec-txt">${entry.factors}</div></div>
  </div>`;
}

function openModal(prod,date,entry){
  document.getElementById('overlay').classList.add('open');
  if(prod) switchTab(prod);
  // 수정 모드일 경우 필드 채우기
  if(entry && prod){
    document.getElementById(`f-price-${prod}`).value=entry.price;
    document.getElementById(`f-pct-${prod}`).value=entry.changePct;
    document.getElementById(`f-date-${prod}`).value=entry.date.replace(/\./g,'-');
    document.getElementById(`f-dir-${prod}`).value=entry.direction;
    document.getElementById(`f-co-${prod}`).value=entry.commentary;
    document.getElementById(`f-fa-${prod}`).value=entry.factors;
  } else {
    // 신규 입력 시 기준일 자동 세팅
    const today = new Date().toISOString().split('T')[0];
    PRODS.forEach(p => { if(!document.getElementById(`f-date-${p}`).value) document.getElementById(`f-date-${p}`).value = today; });
  }
}

function closeModal(){ document.getElementById('overlay').classList.remove('open'); }

function switchTab(p){
  activeTab=p;
  document.querySelectorAll('.tab-panel').forEach(el=>el.classList.remove('active'));
  document.getElementById('panel-'+p).classList.add('active');
  document.querySelectorAll('.m-tab').forEach(el=>el.classList.remove('active'));
  document.querySelector(`[data-tab="${p}"]`).classList.add('active');
}

// 통합 저장 기능: 파싱이 완료된 모든 탭을 차례로 저장
async function doSaveAll(){
  const info = document.getElementById('m-info');
  info.textContent = "처리 중...";
  let count = 0;
  
  for(const p of PRODS){
    const price = document.getElementById(`f-price-${p}`).value;
    const date = document.getElementById(`f-date-${p}`).value;
    
    if(price && date){ // 가격과 날짜가 입력된 탭만 처리
      const data={
        date: date.replace(/-/g,'.'),
        price: parseFloat(price),
        changePct: parseFloat(document.getElementById(`f-pct-${p}`).value || 0),
        direction: document.getElementById(`f-dir-${p}`).value,
        commentary: document.getElementById(`f-co-${p}`).value.trim(),
        factors: document.getElementById(`f-fa-${p}`).value.trim(),
        outlook: ''
      };
      try {
        await fetch(GAS, { method: 'POST', headers: { 'Content-Type': 'text/plain' }, body: JSON.stringify({action:'save', sheet:p, data}) });
        count++;
      } catch(e) { console.error(`${p} 저장 실패`); }
    }
  }
  
  if(count > 0){
    toast(`✅ ${count}건 저장 완료`, 'ok');
    closeModal();
    // 저장 후 입력 필드 초기화 (필요시)
    PRODS.forEach(p => { document.getElementById(`ta-${p}`).value = ''; document.getElementById(`f-price-${p}`).value = ''; });
    loadData();
  } else {
    toast('저장할 데이터가 없습니다.', 'err');
  }
}

// 파싱 로직 (WTI와 브리핑 양식 통합)
function doParse(){
  const p=activeTab, txt=document.getElementById(`ta-${p}`).value.trim();
  if(!txt) return;

  // 1. 가격 추출
  const priceM = txt.match(/배럴당\s*([\d,.]+)\s*달러/) || txt.match(/CFR\s*China[^\n]*?\$\s*([\d,.]+)/i) || txt.match(/FOB\s*Korea[^\n]*?\$\s*([\d,.]+)/i);
  if(priceM) document.getElementById(`f-price-${p}`).value = priceM[1].replace(/,/g,'');

  // 2. 변동률 및 판정
  const pctM = txt.match(/\(([\d.+-]+)%\)/);
  if(pctM) document.getElementById(`f-pct-${p}`).value = pctM[1];
  
  if(txt.includes('상승') || txt.includes('▲')) document.getElementById(`f-dir-${p}`).value = '상승';
  else if(txt.includes('하락') || txt.includes('▼')) document.getElementById(`f-dir-${p}`).value = '하락';

  // 3. 날짜 (yyyy-mm-dd 형식)
  const dateM = txt.match(/(\d{4})년\s*(\d{1,2})월\s*(\d{1,2})일/) || txt.match(/(\d{4})[\-.\/](\d{1,2})[\-.\/](\d{1,2})/);
  if(dateM) document.getElementById(`f-date-${p}`).value = `${dateM[1]}-${dateM[2].padStart(2,'0')}-${dateM[3].padStart(2,'0')}`;

  // 4. 변동요인 (뉴스 문장 추출 - 간단 버전)
  const sentences = txt.split(/[.\n]/).filter(s => s.length > 20);
  if(sentences.length > 0) document.getElementById(`f-fa-${p}`).value = sentences.slice(0, 3).join('.\n') + '.';

  toast(`${p} 파싱 완료 (입력창 확인)`, 'ok');
}

// 나머지 헬퍼 함수들 (Sparkline, Sidebar 등 기존 코드 유지)
const PCLS={WTI:'wti',Styrene:'sm',Benzene:'bz',Butadiene:'bd'};
function drawSpark(prod,data){
  const cv=document.getElementById('spark-'+prod); if(!cv || data.length<2) return;
  const ctx=cv.getContext('2d'); ctx.clearRect(0,0,cv.width,cv.height);
  ctx.beginPath(); ctx.strokeStyle='#888'; ctx.lineWidth=1;
  const max=Math.max(...data.map(d=>d.price)), min=Math.min(...data.map(d=>d.price)), range=max-min;
  data.forEach((d,i)=>{
    const x=(i/(data.length-1))*cv.width, y=cv.height - ((d.price-min)/range)*cv.height;
    if(i===0)ctx.moveTo(x,y); else ctx.lineTo(x,y);
  }); ctx.stroke();
}
